name: Build libbbsplus

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-amd64:
    name: Linux AMD64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: node/package-lock.json

      - name: Build vendored Go native library
        run: make docker-sync-go-native-linux-amd64

      - name: Test Node package
        run: make test-node

      - name: Commit vendored native libraries
        if: github.actor != 'github-actions[bot]'
        run: |
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git status --short -- go/native/linux_amd64 node/native/linux_amd64

          if [ -z "$(git status --porcelain -- go/native/linux_amd64 node/native/linux_amd64)" ]; then
            echo "No vendored native changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go/native/linux_amd64 node/native/linux_amd64
          git commit -m "Update vendored Linux AMD64 native libraries"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Build, test, and package in Docker
        run: make docker-artifacts

      - name: Upload Linux AMD64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: libbbsplus-linux-amd64
          path: dist/libbbsplus-linux-amd64.tar.gz
          if-no-files-found: error

  darwin-arm64:
    name: Darwin ARM64
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: node/package-lock.json

      - name: Build vendored Go native library
        run: make sync-go-native-darwin-arm64

      - name: Test Go package
        run: make test-go-ffi

      - name: Test Node package
        run: make test-node

      - name: Package Darwin ARM64 artifact
        run: make package-darwin-arm64

      - name: Commit vendored native libraries
        if: github.actor != 'github-actions[bot]'
        run: |
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git status --short -- go/native/darwin_arm64 node/native/darwin_arm64

          if [ -z "$(git status --porcelain -- go/native/darwin_arm64 node/native/darwin_arm64)" ]; then
            echo "No vendored Darwin native changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go/native/darwin_arm64 node/native/darwin_arm64
          git commit -m "Update vendored Darwin ARM64 native libraries"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload Darwin ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: libbbsplus-darwin-arm64
          path: dist/libbbsplus-darwin-arm64.tar.gz
          if-no-files-found: error
