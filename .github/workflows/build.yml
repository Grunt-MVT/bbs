name: Build libbbsplus

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-amd64:
    name: Linux AMD64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build vendored Go native library
        run: make docker-sync-go-native-linux-amd64

      - name: Commit vendored Go native library
        if: github.actor != 'github-actions[bot]'
        run: |
          git status --short -- go/native/linux_amd64

          if [ -z "$(git status --porcelain -- go/native/linux_amd64)" ]; then
            echo "No vendored native changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go/native/linux_amd64
          git commit -m "Update vendored Linux AMD64 native library"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Build, test, and package in Docker
        run: make docker-artifacts

      - name: Upload Linux AMD64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: libbbsplus-linux-amd64
          path: dist/libbbsplus-linux-amd64.tar.gz
          if-no-files-found: error
